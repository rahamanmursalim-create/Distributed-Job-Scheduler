<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Connection lines -->
  <g stroke="#C7D2FE" stroke-width="1.5" opacity="0.7">
    <line x1="600" y1="400" x2="300" y2="200"/>
    <line x1="600" y1="400" x2="900" y2="200"/>
    <line x1="600" y1="400" x2="200" y2="500"/>
    <line x1="600" y1="400" x2="1000" y2="500"/>
    <line x1="600" y1="400" x2="400" y2="620"/>
    <line x1="600" y1="400" x2="800" y2="620"/>
    <line x1="300" y1="200" x2="150" y2="100"/>
    <line x1="300" y1="200" x2="450" y2="100"/>
    <line x1="900" y1="200" x2="750" y2="100"/>
    <line x1="900" y1="200" x2="1050" y2="100"/>
  </g>
  <!-- Worker nodes (small) -->
  <g fill="#A5B4FC" opacity="0.8">
    <circle cx="150" cy="100" r="14"/>
    <circle cx="450" cy="100" r="14"/>
    <circle cx="750" cy="100" r="14"/>
    <circle cx="1050" cy="100" r="14"/>
    <circle cx="200" cy="500" r="14"/>
    <circle cx="1000" cy="500" r="14"/>
    <circle cx="400" cy="620" r="14"/>
    <circle cx="800" cy="620" r="14"/>
  </g>
  <!-- Secondary nodes -->
  <g fill="#67E8F9" opacity="0.9">
    <circle cx="300" cy="200" r="20"/>
    <circle cx="900" cy="200" r="20"/>
  </g>
  <!-- Central scheduler node -->
  <circle cx="600" cy="400" r="48" fill="url(#node)" opacity="0.95"/>
  <!-- Clock icon inside central node -->
  <circle cx="600" cy="400" r="30" fill="none" stroke="#fff" stroke-width="3"/>
  <line x1="600" y1="400" x2="600" y2="376" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="600" y1="400" x2="618" y2="410" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="600" cy="400" r="3" fill="#fff"/>
  <!-- Label -->
  <text x="600" y="470" text-anchor="middle" font-family="Arial,sans-serif"
        font-size="16" font-weight="600" fill="#4338CA">Distributed Job Scheduler</text>
  <text x="600" y="492" text-anchor="middle" font-family="Arial,sans-serif"
        font-size="11" fill="#6366F1">High-Availability · Scalable · Distributed</text>
</svg>
